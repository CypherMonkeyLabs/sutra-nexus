<text x="36" y="600" font-size="13" font-weight="700" fill="#052e2b">Disclaimer</text><text x="36" y="618" font-size="11" fill="#0b1f2a">Sūtra Nexus is an independent, free, learning-only student project. It respects every</text><text x="36" y="633" font-size="11" fill="#0b1f2a">tradition, scholar, publisher, company and vendor. Trademarks, texts and sources belong to</text><text x="36" y="648" font-size="11" fill="#0b1f2a">their owners, and nothing here is affiliated with or endorsed by them. If something should</text><text x="36" y="663" font-size="11" fill="#0b1f2a">be removed or corrected, it will be handled promptly through the contact form. Nothing here</text><text x="36" y="678" font-size="11" fill="#0b1f2a">is sold. I am happy to volunteer for any organization.</text><text x="36" y="699" font-size="11" fill="#134e4a">Learner path drawn for this app. Counts and file notes are from the data. Confirm before relying on any wider claim.</text>
