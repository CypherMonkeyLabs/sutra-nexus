<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#0891b2"/></marker></defs><rect x="40" y="140" width="191" height="120" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="52" y="176" font-size="14" fill="#1b1340">One-minute read</text><path d="M 227 200 H 247" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/><rect x="255" y="140" width="191" height="120" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="267" y="176" font-size="14" fill="#1b1340">Ten-minute read</text><path d="M 442 200 H 462" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/><rect x="470" y="140" width="191" height="120" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="482" y="176" font-size="14" fill="#1b1340">One-hour course</text><path d="M 657 200 H 677" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/><rect x="685" y="140" width="191" height="120" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="697" y="176" font-size="14" fill="#1b1340">Mute and read</text><text x="40" y="320" font-size="15" fill="#3b3560">A moving dot shows the reading order. Reduced motion hides it.</text>
