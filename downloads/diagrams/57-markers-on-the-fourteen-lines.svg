<text x="40" y="56" font-size="26" fill="#f8fafc">Markers on the fourteen lines</text>
<text x="48" y="108" font-size="18" fill="#1b1340">1. marker ṇ · first sound a</text><text x="48" y="138" font-size="18" fill="#1b1340">2. marker k · first sound ṛ</text><text x="48" y="168" font-size="18" fill="#1b1340">3. marker ṅ · first sound e</text><text x="48" y="198" font-size="18" fill="#1b1340">4. marker c · first sound ai</text><text x="48" y="228" font-size="18" fill="#1b1340">5. marker ṭ · first sound h</text><text x="48" y="258" font-size="18" fill="#1b1340">6. marker ṇ · first sound l</text><text x="48" y="288" font-size="18" fill="#1b1340">7. marker m · first sound ñ</text><text x="48" y="318" font-size="18" fill="#1b1340">8. marker ñ · first sound jh</text><text x="48" y="348" font-size="18" fill="#1b1340">9. marker ṣ · first sound gh</text><text x="48" y="378" font-size="18" fill="#1b1340">10. marker ś · first sound j</text><text x="48" y="408" font-size="18" fill="#1b1340">11. marker v · first sound kh</text><text x="48" y="438" font-size="18" fill="#1b1340">12. marker y · first sound k</text><text x="48" y="468" font-size="18" fill="#1b1340">13. marker r · first sound ś</text><text x="48" y="498" font-size="18" fill="#1b1340">14. marker l · first sound h</text>
