<!doctype html>
<html lang="en" data-theme="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sūtra Nexus · Ancient rules. Living systems.</title>
<meta name="description" content="Sūtra Nexus: a free, offline study app for Sanskrit sound and grammar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🪔%3C/text%3E%3C/svg%3E">
<style>/* Sūtra Nexus · offline stylesheet. System fonts only. */
:root{--fscale:1;--r:16px;--hdr:0px;
 --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Mangal","Nirmala UI",sans-serif;
 --dev:"Noto Sans Devanagari","Noto Serif Devanagari","Mangal","Nirmala UI","Kohinoor Devanagari",system-ui,sans-serif;
 --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
 --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
html{font-size:calc(16px*var(--fscale));-webkit-text-size-adjust:100%;scroll-behavior:smooth}
/* themes */
html,html[data-theme=aurora]{--bg:#eafaf4;--bgx:radial-gradient(900px 500px at 8% -5%,#c9f4e4 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#e0d4ff 0,transparent 60%),radial-gradient(900px 600px at 50% 105%,#ffe0ee 0,transparent 60%);
 --surface:#ffffffee;--surface2:#f3f0ff;--ink:#14142b;--mute:#3d4266;--line:#1e1b4b33;--c1:#5b21b6;--c2:#0e7490;--c3:#be185d;--c4:#a24b06;--onc:#fff;--glow:#7c3aed66;--hl:#7c3aed22;--hdrbg:#ffffffdd;--ftbg:linear-gradient(120deg,#cffafe,#e9d5ff,#fbcfe8,#fde68a);--dark:0}
html[data-theme=neon]{--bg:#0b0720;--bgx:radial-gradient(800px 500px at 10% 0,#3b0a6b88 0,transparent 60%),radial-gradient(700px 500px at 100% 20%,#00ffd533 0,transparent 60%);
 --surface:#16113aee;--surface2:#211a52;--ink:#f3f1ff;--mute:#c4c0ee;--line:#8b7bff55;--c1:#67e8f9;--c2:#f0abfc;--c3:#fde047;--c4:#86efac;--onc:#0b0720;--glow:#22d3ee88;--hl:#67e8f922;--hdrbg:#0b0720e6;--ftbg:linear-gradient(120deg,#0e7490,#6d28d9,#a21caf,#047857);--dark:1}
html[data-theme=holo]{--bg:#f7eefe;--bgx:conic-gradient(from 210deg at 20% 0,#ffd6ec,#cdeeff,#e4d6ff,#d3ffe9,#ffd6ec);--surface:#ffffffe6;--surface2:#f2ecff;--ink:#14142b;--mute:#3d4266;--line:#4c1d9533;--c1:#6d28d9;--c2:#0e7490;--c3:#be185d;--c4:#a24b06;--onc:#fff;--glow:#06b6d466;--hl:#06b6d422;--hdrbg:#ffffffdd;--ftbg:linear-gradient(120deg,#fbcfe8,#bae6fd,#ddd6fe,#bbf7d0);--dark:0}
html[data-theme=sunset]{--bg:#1d0a33;--bgx:linear-gradient(160deg,#2a0a45 0,#4a0e47 50%,#6b1d3a 100%);--surface:#2d1347ee;--surface2:#3a1a58;--ink:#fff4e8;--mute:#f2d3e3;--line:#ff9e5e55;--c1:#ffa869;--c2:#ff8ad0;--c3:#ffe066;--c4:#7eeafc;--onc:#1d0a33;--glow:#ff6ec788;--hl:#ff9e5e22;--hdrbg:#1d0a33ea;--ftbg:linear-gradient(120deg,#9a3412,#be185d,#6d28d9,#0e7490);--dark:1}
html[data-theme=light]{--bg:#ffffff;--bgx:linear-gradient(#fff,#f6f7fb);--surface:#ffffff;--surface2:#f3f4fa;--ink:#14142b;--mute:#40445f;--line:#1e1b4b33;--c1:#5b21b6;--c2:#0e7490;--c3:#be185d;--c4:#a24b06;--onc:#fff;--glow:#5b21b633;--hl:#5b21b61a;--hdrbg:#ffffffee;--ftbg:linear-gradient(120deg,#e0f2fe,#ede9fe,#fce7f3,#fef3c7);--dark:0}
html[data-theme=contrast]{--bg:#000;--bgx:#000;--surface:#000;--surface2:#000;--ink:#fff;--mute:#fff;--line:#fff;--c1:#ffff00;--c2:#00ffff;--c3:#ff9dff;--c4:#8cff8c;--onc:#000;--glow:#ffff0000;--hl:#ffff0033;--hdrbg:#000;--ftbg:#000;--dark:1}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);background-image:var(--bgx);background-attachment:fixed;line-height:1.55;overflow-x:hidden;min-height:100vh}
html{overflow-x:hidden}
.dev{font-family:var(--dev);line-height:1.5}
a{color:var(--c2)} a:hover{text-decoration:none}
:focus-visible{outline:3px solid var(--c3);outline-offset:2px;border-radius:6px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.skip{position:absolute;left:8px;top:-60px;background:var(--c1);color:var(--onc);padding:10px 14px;border-radius:10px;z-index:200}.skip:focus{top:8px}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem} h2{font-size:1.5rem} h3{font-size:1.1rem}
p{margin:.4rem 0 .8rem}
.mute{color:var(--mute)} .sm{font-size:.86rem}
/* banner */
#banner{position:sticky;top:0;z-index:60;background:var(--hdrbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4)) 1;box-shadow:0 6px 24px -10px var(--glow)}
.bn-top{display:flex;align-items:center;gap:10px;padding:6px 12px 2px;max-width:1280px;margin:auto}
.brand{display:flex;align-items:center;gap:8px;min-width:0;text-decoration:none;color:var(--ink)}
.brand .logo{font-size:1.5rem;line-height:1;flex:none;filter:drop-shadow(0 0 8px var(--glow))}
.brand b{font-size:1.15rem;white-space:nowrap}
.brand small{display:block;color:var(--mute);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span.bt{min-width:0}
.bn-id{flex:1;font-size:.8rem;color:var(--mute);padding-left:10px;border-left:1px solid var(--line);min-width:0}
#display{display:flex;align-items:center;gap:4px;margin-left:auto;flex:none}
#display button,#display select{min-height:36px;min-width:36px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;font:inherit;font-size:.85rem;cursor:pointer;padding:0 8px}
#display button[aria-pressed=true]{background:var(--c1);color:var(--onc);border-color:var(--c1)}
#display select{max-width:116px}
.bn-nav{display:flex;gap:2px;overflow-x:auto;padding:2px 10px 6px;max-width:1280px;margin:auto;scrollbar-width:none}
.bn-nav::-webkit-scrollbar{display:none}
.bn-nav a{flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border-radius:12px;text-decoration:none;color:var(--ink);font-size:.86rem;border:1px solid transparent}
.bn-nav a .ic{font-family:var(--emoji);font-size:1.15rem}
.bn-nav a[aria-current=page]{background:var(--hl);border-color:var(--c1);box-shadow:0 0 14px -2px var(--glow)}
.bn-nav a:hover{border-color:var(--line)}
/* wheel + drawer */
#wheel{position:fixed;left:0;top:44%;z-index:70;width:56px;height:56px;border-radius:50%;border:2px solid var(--c1);background:var(--surface);color:var(--c1);cursor:pointer;display:grid;place-items:center;transform:translateX(-62%);transition:transform .35s ease,opacity .35s;box-shadow:0 0 22px var(--glow),inset 0 0 12px var(--glow);padding:0}
#wheel.show,#wheel:hover,#wheel:focus-visible{transform:translateX(6px)}
#wheel svg{width:36px;height:36px;animation:spin 14s linear infinite}
#wheel::after{content:"";position:absolute;left:-14px;top:0;width:14px;height:100%} /* hover bridge */
@keyframes spin{to{transform:rotate(360deg)}}
#scrim{position:fixed;inset:0;background:#0009;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;left:0;top:0;bottom:0;width:min(380px,92vw);z-index:90;background:var(--surface2);color:var(--ink);border-right:2px solid var(--c1);box-shadow:8px 0 40px var(--glow);transform:translateX(-105%);transition:transform .3s ease;overflow-y:auto;padding:12px;visibility:hidden}
#drawer.on{transform:none;visibility:visible}
#drawer h2{font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;margin:4px 4px 10px}
#drawer .x{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.2rem;cursor:pointer}
#drawer a{display:flex;gap:12px;align-items:center;min-height:56px;padding:6px 10px;margin:4px 0;border-radius:14px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface)}
#drawer a .ic{font-family:var(--emoji);font-size:1.5rem;width:34px;text-align:center;flex:none}
#drawer a b{display:block;font-size:.98rem} #drawer a span.d{display:block;font-size:.8rem;color:var(--mute);line-height:1.3}
#drawer a[aria-current=page]{border-color:var(--c1);background:var(--hl);box-shadow:0 0 16px -2px var(--glow)}
/* layout */
main{max-width:1180px;margin:0 auto;padding:16px 14px 90px;min-height:70vh}
.room{display:none;animation:rise .4s ease both}.room.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rh{display:flex;gap:12px;align-items:center;margin:6px 0 14px}
.rh .big{font-family:var(--emoji);font-size:2.2rem;filter:drop-shadow(0 0 10px var(--glow))}
.rh h1{font-size:1.9rem;margin:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;box-shadow:0 8px 28px -16px var(--glow)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4))}
.card.hl{border-color:var(--c1);box-shadow:0 0 26px -6px var(--glow)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);font-size:.8rem;margin:2px}
.chip.c1{border-color:var(--c1);color:var(--c1)} .chip.c2{border-color:var(--c2);color:var(--c2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--c1);background:var(--c1);color:var(--onc);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--c1)} .btn:hover{filter:brightness(1.1);box-shadow:0 0 18px var(--glow)}
.btn.sm{min-height:44px;padding:0 12px}
.cite{font-size:.78rem;color:var(--mute);border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.note{border-left:4px solid var(--c3);padding:6px 12px;background:var(--hl);border-radius:0 12px 12px 0;font-size:.9rem;margin:10px 0}
.unk{color:var(--mute);font-style:italic;font-size:.84rem}
.line{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.line>span,.rowx span{overflow-wrap:anywhere;min-width:0}.line .dv{font-size:1.35rem;font-family:var(--dev)} .line .ia{font-size:1rem;color:var(--c2);font-weight:600}
input[type=search],input[type=text],select.f{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;max-width:100%}
select.f{padding-right:6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
/* diagrams */
figure{margin:0}figcaption{font-size:.8rem;color:var(--mute);margin-top:4px}
svg.dg{width:100%;height:auto;display:block;max-width:560px;margin:auto}
.tx{fill:var(--ink);font-size:15px;font-family:var(--font)}.tm{fill:var(--mute);font-size:14px;font-family:var(--font)}
.f1t{fill:var(--c1);font-size:14px;font-weight:700;font-family:var(--font)}.f2t{fill:var(--c2);font-size:14px;font-weight:700;font-family:var(--font)}
.tx.sm,.tm.sm,.f1t.sm,.f2t.sm{font-size:14px}.tx.b{font-weight:700}.tx.big,.tm.big{font-size:26px}.tx.dev,.dev.tx{font-family:var(--dev);font-size:17px}.tx.big{font-size:30px}
.onc{fill:var(--onc);font-size:14px;font-family:var(--font)}.onc.b{font-weight:700}.onc.sm{font-size:14px}
.heatn{fill:var(--ink);font-size:13px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.bx{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}.bx.hl{stroke:var(--c1);stroke-width:2.5}.bx.dim{opacity:.55}
.hl2{fill:var(--c1);opacity:0;rx:12}
.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}.f4{fill:var(--c4)}.s1{stroke:var(--c1)}.s2{stroke:var(--c2)}.s3{stroke:var(--c3)}.s4{stroke:var(--c4)}.o3{opacity:.55}
.flowline{stroke:var(--c2);stroke-width:2.5;fill:none;stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
svg .mm{filter:drop-shadow(0 0 6px var(--glow))}
@keyframes dash{to{stroke-dashoffset:-28}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.35);opacity:1}}
.seqg{animation:seq 7s ease-in-out infinite}.seqg rect{fill:var(--c1)}
@keyframes seq{0%,12%{opacity:.0}4%,8%{opacity:.35}}
.seqg{opacity:0;animation-name:seq2}
@keyframes seq2{0%{opacity:0}3%{opacity:.4}7%{opacity:.4}10%,100%{opacity:0}}
.grow{animation:grow 1.2s ease both;transform-box:view-box}
@keyframes grow{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.growy{animation:growy 1.1s ease both}
@keyframes growy{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.spin{animation:spin 6s linear infinite}
.scan{animation:scan 5s ease-in-out infinite alternate}@keyframes scan{to{transform:translateX(390px)}}
.drop{animation:drop 3s ease-in-out infinite}@keyframes drop{0%,40%{opacity:0}60%,100%{opacity:1}}
/* 3D objects */
.stage{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:center;padding:12px 0 6px;perspective:900px}
.obj{width:150px;height:150px;position:relative;transform-style:preserve-3d;display:grid;place-items:center}
.om3d{animation:ry 12s linear infinite}
.om3d span{position:absolute;font-size:96px;line-height:1;font-family:var(--dev);color:var(--c1)}
.om3d span:nth-child(1){transform:translateZ(-14px);opacity:.25}.om3d span:nth-child(2){transform:translateZ(-8px);opacity:.4;color:var(--c3)}.om3d span:nth-child(3){transform:translateZ(-3px);opacity:.6;color:var(--c2)}
.om3d span:nth-child(4){transform:translateZ(2px);text-shadow:0 0 20px var(--glow),0 0 40px var(--glow)}
@keyframes ry{to{transform:rotateY(360deg)}}
.cube{width:96px;height:130px;animation:ry 16s linear infinite;transform-style:preserve-3d;position:relative}
.cube div{position:absolute;inset:0;border-radius:6px;display:grid;place-items:center;text-align:center;padding:6px;font-family:var(--dev);font-size:15px;line-height:1.3;color:#3b2506;background:linear-gradient(135deg,#f6dfa8,#e8c070);border:2px solid #8a5a12;backface-visibility:hidden;box-shadow:inset 0 0 20px #8a5a1255}
.cube div:nth-child(1){transform:translateZ(48px)}.cube div:nth-child(2){transform:rotateY(90deg) translateZ(48px)}.cube div:nth-child(3){transform:rotateY(180deg) translateZ(48px)}.cube div:nth-child(4){transform:rotateY(270deg) translateZ(48px)}
.lamp{animation:sway 6s ease-in-out infinite;transform-style:preserve-3d}
@keyframes sway{0%,100%{transform:rotateY(-28deg)}50%{transform:rotateY(28deg)}}
.flame{transform-origin:50% 90%;animation:flick 1.4s ease-in-out infinite;transform-box:fill-box}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.9,1.12) rotate(3deg)}}
.orbit{animation:ry 18s linear infinite}
.orbit span{position:absolute;font-family:var(--dev);font-size:30px;font-weight:700;color:var(--c2);text-shadow:0 0 12px var(--glow);left:50%;top:50%;margin:-18px 0 0 -14px;transform:rotateY(calc(var(--i)*45deg)) translateZ(62px)}
.orbit span:nth-child(odd){color:var(--c3)}
.hero{position:relative;text-align:center;padding:10px 0}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);margin:4px 0;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
html[data-theme=contrast] .hero h1{background:none;color:var(--c1)}
.hero .tag{font-size:1.1rem;color:var(--mute);margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{text-align:center;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:0 0 18px -8px var(--glow)}
.stat b{display:block;font-size:2rem;color:var(--c1);font-variant-numeric:tabular-nums}.stat span{font-size:.82rem;color:var(--mute)}
/* path */
.steps{counter-reset:s;display:grid;gap:10px}
.steps a.step{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:var(--ink);padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-height:44px}
.steps a.step::before{counter-increment:s;content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--c1);color:var(--onc);display:grid;place-items:center;font-weight:700}
/* pratyahara */
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;display:grid;place-items:center;line-height:1.1;padding:2px 8px}
.key small{font-size:.7rem;color:var(--mute)} .key .dv{font-family:var(--dev);font-size:1.1rem}
.key[aria-pressed=true]{background:var(--c1);color:var(--onc);border-color:var(--c1)} .key[aria-pressed=true] small{color:var(--onc)}
.key:disabled{opacity:.4;cursor:not-allowed}
.key.mk[aria-pressed=true]{background:var(--c3);border-color:var(--c3);color:var(--onc)}.key.mk[aria-pressed=true] small{color:var(--onc)}
.lines{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.ml{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 10px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.ml>.sm{grid-column:1/-1}.ml .n{width:28px;height:28px;border-radius:50%;background:var(--c1);color:var(--onc);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.snd{display:inline-grid;min-width:34px;height:34px;padding:0 6px;place-items:center;border-radius:10px;border:1px solid var(--line);margin:2px;background:var(--surface2);font-weight:600}
.snd.in{background:var(--c2);border-color:var(--c2);color:var(--onc);animation:pop .4s ease both}
.snd.mk{border-color:var(--c3);border-style:dashed;color:var(--mute)}
.snd.mk.sel{background:var(--c3);color:var(--onc);border-style:solid}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.result{font-size:1.1rem}
/* tables */
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}th{background:var(--surface2)}
/* list rows */
.rowx{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer;min-height:44px}
.rowx:hover,.rowx[aria-expanded=true]{border-color:var(--c1);box-shadow:0 0 14px -4px var(--glow)}
.rowx .num{font-family:var(--mono);color:var(--c1);font-weight:700;margin-right:8px}
.pager{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.detail{padding:10px 12px;margin:-2px 0 8px;border:1px solid var(--c1);border-top:0;border-radius:0 0 12px 12px;background:var(--surface2)}
/* practice */
.fc{perspective:900px;max-width:520px;margin:10px auto}
.fc .face{min-height:200px;border-radius:18px;border:2px solid var(--c1);background:var(--surface);padding:22px;display:grid;place-items:center;text-align:center;font-size:1.15rem;box-shadow:0 0 30px -8px var(--glow);cursor:pointer;width:100%;color:var(--ink);font-family:inherit}
.opt{display:block;width:100%;text-align:left;margin:6px 0;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:8px 12px;cursor:pointer}

/* ===== ECOSYSTEM ===== */
N.renderers.ecosystem=function(el){
 var bridges=[['Pratyāhāra and character classes','A pratyāhāra names a run of sounds with two letters, much as a pattern such as a-z names a range of characters. This is an analogy.'],['Anuvṛtti and inheritance','Carrying words forward so a rule stays short resembles inheriting default values. An analogy.'],['Saṃjñā and named constants','Defining a name once (guṇa, vṛddhi) and using it afterwards resembles a named constant. An analogy.'],['Vidhi and rewrite rules','Many vidhi sūtras read like “replace X by Y in context Z”, the shape of a rewrite rule. An analogy.'],['Sthāna, prayatna and speech features','Place and manner of articulation are the same kind of features that speech systems describe sounds with. An analogy.'],['The app’s own pipeline','Open data, small scripts, a static app and a helper bot: the pipeline diagram below shows how this app is made.']];
 var sisters=['Vedic phonetics (śikṣā) and the prātiśākhya texts','Sandhi in depth','Dhātu (verb roots) and pratyaya (suffixes)','Kāraka and case relations','Kashmir Śaiva philosophy beyond the sūtra text','Devanāgarī reading practice'];
 var hooks=['Add an open-licensed English translation when one is identified (translator and edition must be named).','Add a human-checked IAST column.','Recorded pronunciation made by me, with the consent and licence handled properly.','More sūtras with bridge ideas, each checked.','A real cloud endpoint for the guide bot (unset by default).','Instagram, Kaggle and Google Developer links in the footer: one line in the SOCIALS array.'];
 el.innerHTML=head('ecosystem')+'<div class="grid two">'+card('Mind map',fig(D.mindmap(),'Tap a bubble to open a room.'))+card('How this app is made',fig(D.pipeline(),'From open data to this page.'))+'</div>'+
 '<h2 style="margin-top:18px">Bridges</h2><p class="sm mute">Each is a bridge idea: an analogy offered as an interpretation, not a claim from the sources.</p><div class="grid">'+bridges.map(function(b){return card(b[0],'<p>'+b[1]+'</p>')}).join('')+'</div>'+
 '<div class="grid two" style="margin-top:14px">'+card('Sister topics (not covered by the data here)','<ul>'+sisters.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ul>')+card('Future hooks','<ul>'+hooks.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ul>')+'</div>'+
 '<h2 style="margin-top:18px">Glossary</h2><div class="bar"><input type="search" id="gq" placeholder="Filter the glossary" aria-label="Filter glossary"></div><div class="grid" id="gl"></div><p class="sm mute">Glossary lines are plain-English summaries at textbook level and are interpretations, not quotations. Cite: Sūtra Nexus glossary, compiled by me; cross-checked with the sūtra data where the term appears in it.</p>';
 function g(){var f=N.plain($('#gq',el).value);$('#gl',el).innerHTML=C.glossary.filter(function(x){return !f||N.plain(x[0]+' '+x[2]).indexOf(f)>=0}).map(function(x){return '<div class="card" style="padding:12px"><b>'+esc(x[0])+'</b> <span class="dev mute">'+esc(x[1])+'</span><br><span class="sm">'+esc(x[2])+'</span></div>'}).join('')}
 $('#gq',el).addEventListener('input',g);g();
};

 '<div class="grid two" style="margin-top:14px">'+card('What is not here (gaps)','<ul class="sm"><li>English meanings: UNKNOWN in source. No translation is included; edition and translator: UNKNOWN.</li><li>The transliteration of all three files was produced by a script, not checked by a person.</li><li>The Devanāgarī of the Śiva Sūtras is machine-converted from IAST.</li><li>Which sūtras make the difference between 75 and 77: UNKNOWN beyond the source meta.</li><li>The Aṣṭādhyāyī data has '+C.stats.total.toLocaleString('en-US')+' records, not independently audited against the traditional count.</li><li>The Bhagavad Gita is not part of this data and is not included.</li></ul>')+card('Privacy and offline use','<p class="sm">Everything runs in your browser from local files. No fonts, scripts or images are loaded from the internet. Progress, theme and text size are saved only in this browser. The guide bot has an optional cloud endpoint hook that is unset.</p>')+'</div>'+
 '<div class="card" style="margin-top:14px"><h3>Disclaimer</h3><p>Sūtra Nexus is an independent, free, learning-only student project. It respects every company, tradition and vendor; trademarks and sources belong to their owners. If something should be removed or corrected, it will be handled promptly via <a href="https://cyphermonkeylabs.com/#contact" rel="noopener">https://cyphermonkeylabs.com/#contact</a>. Nothing here is sold, and I am happy to volunteer for any organization.</p></div>';
};

<script>window.NEXUS_KB={"name":"Nexus Monkey","app":"Sūtra Nexus","tagline":"Ancient rules. Living systems.","entries":[{"k":["what is this","about","sutra nexus","what is sutra nexus","purpose","who made"],"a":"Sūtra Nexus is a free, offline study app for Sanskrit sound and grammar, made by a lifelong student and AI enthusiast. It reads from three open data files: the Aṣṭādhyāyī (3,983 sūtras), the 14 Māheśvara lines and 75 Śiva Sūtras.","room":"about","t":"app"},{"k":["start","where do i start","begin","new here","path","curriculum","one hour","1 hour"],"a":"Open Start Here for a seven-step path of about one hour: Start Here, Māheśvara lines, the pratyāhāra builder, Sound lab, Aṣṭādhyāyī browser, Śiva Sūtras and Practice. I can walk you through it: say 'one hour path'.","room":"start","t":"app"},{"k":["theme","themes","dark mode","colors","colours","contrast","font size","text size","bigger text","display","reduce motion","animation"],"a":"The Display control at the top has A-, A and A+ for text size, a theme list (Aurora, Neon, Holographic, Cyberpunk Sunset, Light, High contrast) and a motion button. All are saved in this browser.","room":null,"t":"app"},{"k":["offline","internet","network","privacy","data","localstorage","save","progress"],"a":"Everything runs from local files with no internet needed. Your progress, theme and text size are saved only in this browser. The bot's optional cloud endpoint is unset.","room":null,"t":"app"},{"k":["gita","bhagavad gita","geeta"],"a":"The Bhagavad Gita is not part of this app's data, so I cannot quote it here.","room":null,"t":"limits"},{"k":["translation","english meaning","meaning of sutra","translate","gloss"],"a":"The data files carry no English meanings, so lines say 'meaning: UNKNOWN in source'. I show a short 'bridge idea' only for a few well-known sūtras, and label it as an interpretation. Edition and translator for any gloss: UNKNOWN.","room":"about","t":"limits"},{"k":["75 77","recension","kshemaraja","kashmir numbering","how many shiva sutras"],"a":"The Śiva Sūtras file holds 75 sūtras (20 + 10 + 45, Vārttika-recension numbering). The file's meta note says the common Kṣemarāja recension counts 22 + 10 + 45. Which sūtras differ: UNKNOWN beyond the source.","room":"shiva","t":"shiva"},{"k":["licence","license","copyright","credit","source","sources","where does the data come from"],"a":"Aṣṭādhyāyī and Māheśvara text: ashtadhyayi-com/data, free to use with credit. Śiva Sūtras: GRETIL electronic text (ed. Madhusudan Kaul Shastri 1925, input Oliver Hellwig). Transliteration is machine-converted and unchecked by a person.","room":"about","t":"app"},{"k":["pratyahara","pratyahara builder","build pratyahara","how do pratyaharas work","it marker","marker","anubandha"],"a":"A pratyāhāra is a two-letter label for a run of sounds in the 14 Māheśvara lines: start at the first sound, read to the marker, skip the markers. For example ac = a i u ṛ ḷ e o ai au. Try the builder in the Māheśvara room.","room":"maheshvara","t":"pratyahara"},{"k":["sandhi","join sounds","guna","vriddhi","yan"],"a":"Sandhi is the joining of sounds. Examples with the sūtras that govern them: a + i → e (6.1.87 guṇa), a + e → ai (6.1.88 vṛddhi), i + ā → yā (6.1.77 yaṇ), ā + ā → ā (6.1.101). Open the Sound lab for the flows.","room":"sound","t":"sandhi"},{"k":["anuvritti","carry forward","inheritance of words"],"a":"Anuvṛtti is carrying a word forward from an earlier sūtra. The data lists it per sūtra; for example 1.1.4 carries इकः and गुण-वृद्धी. Open any sūtra in the Aṣṭādhyāyī room to see it.","room":"ashtadhyayi","t":"structure"},{"k":["types","sutra types","type codes","samjna","vidhi","paribhasha","adhikara"],"a":"Type codes in the data: S = saṃjñā (definition), P = paribhāṣā (rule for reading rules), V = vidhi (operative rule), plus AD and AT, which the data does not expand. Counts: V 3,629, S 200, AT 67, AD 64, P 23.","room":"ashtadhyayi","t":"structure"},{"k":["sthana","places of articulation","mouth","throat","palate","lips","teeth"],"a":"Sthāna means place of articulation: kaṇṭha (throat), tālu (palate), mūrdhan (roof of mouth), danta (teeth), oṣṭha (lips), plus combined places for e, ai, o, au and v. See the Sound lab (textbook summary, not from the data files).","room":"sound","t":"sound"},{"k":["quiz","test me","score"],"a":"Say 'quiz me' for a five-question quiz here, or open the Practice room for ten questions.","room":"practice","t":"app"},{"k":["flashcards","cards","spaced","ladder","leitner","review"],"a":"Flashcards use a spaced ladder: a correct answer moves a card up a box (gaps of today, 1, 3, 7, 14 and 30 days); a miss returns it to box 1. Say 'flashcard' to try one here.","room":"practice","t":"app"},{"k":["hello","hi","hey","namaste"],"a":"Namaste. I am the monkey guide for Sūtra Nexus. Ask me about sūtras, pratyāhāras, sounds or this app, or use the chips below.","room":null,"t":"app"},{"k":["thanks","thank you"],"a":"You are welcome. Keep saying the lines aloud; it helps.","room":null,"t":"app"},{"k":["contact","report a concern","remove content"],"a":"If something should be removed or corrected, please use the contact section at https://cyphermonkeylabs.com/#contact. The project is free and learning-only.","room":"about","t":"app"},{"k":["who is lucky","creator","author"],"a":"A lifelong student and AI enthusiast from systems, networking, voice and contact center work, growing into AI omni-channel agents, sharing what he learns for free.","room":"about","t":"app"},{"k":["sūtra","sutra","सूत्र"],"a":"sūtra (सूत्र): A very short rule. The Aṣṭādhyāyī is a collection of such rules.","room":"ecosystem","t":"glossary"},{"k":["aṣṭādhyāyī","astadhyayi","अष्टाध्यायी"],"a":"Aṣṭādhyāyī (अष्टाध्यायी): Pāṇini's grammar of Sanskrit, in eight adhyāyas (chapters).","room":"ecosystem","t":"glossary"},{"k":["adhyāya","adhyaya","अध्याय"],"a":"adhyāya (अध्याय): A chapter. The Aṣṭādhyāyī has eight; each has four pādas.","room":"ecosystem","t":"glossary"},{"k":["pāda","pada","पाद"],"a":"pāda (पाद): A quarter-chapter. Locus 6.1.77 means adhyāya 6, pāda 1, sūtra 77.","room":"ecosystem","t":"glossary"},{"k":["māheśvara sūtras","mahesvara sutras","माहेश्वरसूत्र"],"a":"Māheśvara sūtras (माहेश्वरसूत्र): The 14 lines of sounds, each ending in a marker, that open the pratyāhāra system.","room":"ecosystem","t":"glossary"},{"k":["pratyāhāra","pratyahara","प्रत्याहार"],"a":"pratyāhāra (प्रत्याहार): A short label (for example ac) for a run of sounds in the 14 lines, from a first sound up to a marker.","room":"ecosystem","t":"glossary"},{"k":["it (marker)","it (marker)","इत्"],"a":"it (marker) (इत्): A sound used only as a boundary marker and not counted in the set. The last letter of each Māheśvara line is one.","room":"ecosystem","t":"glossary"},{"k":["varṇa","varna","वर्ण"],"a":"varṇa (वर्ण): A sound or letter-sound of the language.","room":"ecosystem","t":"glossary"},{"k":["svara","svara","स्वर"],"a":"svara (स्वर): A vowel.","room":"ecosystem","t":"glossary"},{"k":["vyañjana","vyanjana","व्यञ्जन"],"a":"vyañjana (व्यञ्जन): A consonant.","room":"ecosystem","t":"glossary"},{"k":["sthāna","sthana","स्थान"],"a":"sthāna (स्थान): The place of articulation: where in the mouth a sound is made.","room":"ecosystem","t":"glossary"},{"k":["prayatna","prayatna","प्रयत्न"],"a":"prayatna (प्रयत्न): The effort or manner of articulation.","room":"ecosystem","t":"glossary"},{"k":["savarṇa","savarna","सवर्ण"],"a":"savarṇa (सवर्ण): Sounds with the same place and effort, treated as like one another (sūtra 1.1.9).","room":"ecosystem","t":"glossary"},{"k":["saṃjñā","samjna","संज्ञा"],"a":"saṃjñā (संज्ञा): A technical name or definition, for example guṇa and vṛddhi.","room":"ecosystem","t":"glossary"},{"k":["paribhāṣā","paribhasa","परिभाषा"],"a":"paribhāṣā (परिभाषा): A rule about how other rules are read or applied.","room":"ecosystem","t":"glossary"},{"k":["vidhi","vidhi","विधि"],"a":"vidhi (विधि): An operative rule that says what happens.","room":"ecosystem" var BASE=function(){var r=(KB.rooms[ctx]||{}).chips||[];return ['Help here'].concat(r).concat(['Quick tour','Teach me','Quiz me','Flashcard','Fun fact','Daily challenge','My badges','One hour path'])};

function toggle(o){open=o===undefined?!open:o;P.hidden=!open;$('#gbB').setAttribute('aria-expanded',open);$('#gbB').style.display=open&&innerWidth<700?'none':'';$('#gbN').hidden=true;if(open){if(!history.length)hello();Q.focus({preventScroll:true})}else if(window.speechSynthesis)try{speechSynthesis.cancel()}catch(e){}}

/* ---------- matching ---------- */
function plain(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;var p=[],i,j;for(j=0;j<=b.length;j++)p[j]=j;for(i=1;i<=a.length;i++){var c=[i];for(j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
function toks(s){return plain(s).replace(/[^a-z0-9\u0900-\u097F ]/g,' ').split(/\s+/).filter(Boolean).map(function(t){return KB.syn[t]||t})}
var STOP={the:1,a:1,an:1,is:1,of:1,to:1,what:1,whats:1,me:1,about:1,tell:1,how:1,do:1,i:1,in:1,and:1,are:1,does:1,this:1,that:1,it:1,my:1,can:1,you:1,please:1,explain:1,show:1,for:1};
var IDX=KB.entries.map(function(e){return {e:e,p:e.k.map(function(k){return plain(k).trim()}),t:e.k.map(function(k){return toks(k).filter(function(t){return !STOP[t]})})}});
function score(q,qt){var best=0,bi=null;IDX.forEach(function(x){var s=0;x.p.forEach(function(p,i){if(!p)return;if(q===p)s=Math.max(s,10+(x.e.t==='prat'?.5:0));else if(p.length>3&&q.indexOf(p)>=0)s=Math.max(s,6+Math.min(p.length,12)/6);var T=x.t[i];if(!T.length)return;var hit=0;T.forEach(function(t){if(qt.some(function(u){return u===t||(t.length>4&&u[0]===t[0]&&lev(u,t)<=1)||(t.length>8&&u[0]===t[0]&&lev(u,t)<=2)}))hit++});var f=hit/T.length;if(hit&&f>=.6)s=Math.max(s,f*5+hit*.4)});if(s>best){best=s;bi=x.e}});return {s:best,e:bi}}
var SUT=/\b([1-8])\.([1-4])\.(\d{1,3})\b/;
function sutra(n){if(!X.ashta.length)return 'The sūtra data is still loading. Please ask again in a moment.';var r=X.ashta.filter(function(x){return x[0]===n})[0];if(!r)return null;var b=window.NEXUS_CONTENT&&NEXUS_CONTENT.bridges[n];return 'Aṣṭādhyāyī '+n+': '+r[1]+' ('+r[2]+'). Type '+r[5]+'. Words carried forward: '+(r[4].length?r[4].join(' · '):'none listed')+'. Word split: '+r[3]+'. '+(b?'Bridge idea (an interpretation): '+b:'English meaning: UNKNOWN in source.')+' Cite: Aṣṭādhyāyī · '+n+' · ashtadhyayi-com/data.'}
function ask(text){text=text.trim();if(!text)return;var q=plain(text).trim(),T=q.split(/\s+/);
 var m=text.match(SUT);if(m){var a=sutra(m[0]);if(a){say(a);N.go('ashtadhyayi');setTimeout(function(){N.ashtaSearch&&N.ashtaSearch(m[0])},400);return after([['Open it','ashtadhyayi']])}say('I do not have a sūtra numbered '+m[0]+' in this app’s data.');return after()}
 var cmd={'help here':help,'help':help,'quick tour':function(){tour('quick')},'tour':function(){tour('quick')},'pratyahara tour':function(){tour('pratyahara')},'teach me':teach,'quiz me':function(){quiz(5)},'quiz':function(){quiz(5)},'flashcard':card,'flashcards':card,'fun fact':fact,'daily challenge':daily,'my badges':badges,'badges':badges,'one hour path':path,'1 hour path':path,'menu':menu};
 if(cmd[q])return cmd[q]();
 var sc=score(q,toks(text));if(sc.s>=3.2){say(sc.e.a);if(sc.e.room&&sc.e.room!==ctx){after([['Open '+sc.e.room,sc.e.room]])}else after();return}
 if(CFG.cloudEndpoint){fetch(CFG.cloudEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:text,room:ctx})}).then(function(r){return r.json()}).then(function(j){say(j.answer||'No answer from the endpoint.');after()}).catch(function(){say('The cloud endpoint did not answer, and I do not know that from this app.');after()});return}
 say('I don’t know that from this app. I can answer about sūtras (try 6.1.77), pratyāhāras (try ik or hal), sounds, sandhi, the types of sūtra and how to use each room.');after()}
function after(go){var c=['Quiz me','Teach me','Fun fact','Quick tour','Flashcard','Help here'];if(go)go.forEach(function(g){c.unshift([g[0],function(){N.go(g[1])}])});chips(c)}
/* ---------- activities ---------- */
function fact(){var f=KB.facts[Math.floor(Math.random()*KB.facts.length)];say('Fun fact: '+f);N.bump('facts');after()}
function tour(k){var T=KB.tours[k],i=0;mode='tour';function step(){var s=T.steps[i];N.go(s[0]);setTimeout(function(){if(s[1]){var e=document.querySelector(s[1]);if(e){e.scrollIntoView({block:'center',behavior:'smooth'});e.classList.add('gb-flash');setTimeout(function(){e.classList.remove('gb-flash')},2600)}}},350);say('Step '+(i+1)+' of '+T.steps.length+': '+s[2]);chips([[i+1<T.steps.length?'Next':'Finish',function(){i++;if(i<T.steps.length)step();else{say('Tour finished. Well done.');N.progress.tours++;N.award('tour');menu()}}],['Stop tour',function(){say('Tour stopped.');menu()}]])}step()}
function teach(){chips([['Pratyāhāra',function(){lesson('pratyahara')}],['Sounds',function(){lesson('sounds')}],['Sandhi',function(){lesson('sandhi')}],['Structure',function(){lesson('structure')}]]);say('What shall I teach you? Each lesson is four short steps.')}
function lesson(k){var L=KB.lessons[k],i=0;function go(){say(L[i]);i++;if(i<L.length)chips([['Next',go],['Stop',menu]]);else{chips([['Quiz me',function(){quiz(5)}],['Another lesson',teach],['Menu',menu]]);N.addXp(5)}}go()}
function quiz(n,title,cb,seedQ){var Q=seedQ||KB.quiz.slice().sort(function(){return Math.random()-.5}).slice(0,n),i=0,sc=0;title=title||'Quiz';function nx(){if(i>=Q.length){var p=Math.round(100*sc/Q.length);N.progress.quizBest=Math.max(N.progress.quizBest,p);N.progress.quizRuns++;N.addXp(sc*3);N.saveProgress();say(title+' done: '+sc+' of '+Q.length+' ('+p+'%).'+(p>=80?' Well done.':' Review and try again.'));if(p>=80)N.award('quiz80');if(cb)cb(p);return menu()}
 var q=Q[i];say((i+1)+'/'+Q.length+'  '+q.q);chips(q.o.map(function(o,k){return [o,function(){if(k===q.a){sc++;say('Correct. '+(q.why||''))}else say('Not quite. Answer: '+q.o[q.a]+'. '+(q.why||''));i++;nx()}]}))}nx()}
function daily(){var d=new Date().toISOString().slice(0,10),seed=0;for(var k=0;k<d.length;k++)seed=(seed*31+d.charCodeAt(k))%100003;var all=KB.quiz.slice(),Q=[];for(var j=0;j<5;j++){seed=(seed*1103515245+12345)%2147483647;Q.push(all.splice(seed%all.length,1)[0])}say('Daily challenge for '+d+': five questions.');quiz(5,'Daily challenge',function(p){N.progress.daily={date:d,pct:p};N.award('daily');N.saveProgress()},Q)}
function card(){var dayN=Math.floor(Date.now()/864e5),LAD=[0,1,3,7,14,30],C=KB.cards.filter(function(c){var s=N.progress.cards[c.id];return !s||s.due<=dayN});if(!C.length){say('No flashcards are due. Come back later.');return menu()}var c=C[Math.floor(Math.random()*C.length)];say('Card ('+c.deck+'): '+c.f);chips([['Show answer',function(){say(c.b);chips([['Got it',function(){var s=N.progress.cards[c.id]||{box:0,due:0};s.box=Math.min(5,s.box+1);s.due=dayN+LAD[s.box];N.progress.cards[c.id]=s;N.bump('reviewed');if(N.progress.reviewed>=20)N.award('cards20');N.addXp(2);say('Moved up to box '+(s.box+1)+'.');card()}],['Again',function(){N.progress.cards[c.id]={box:0,due:dayN};N.saveProgress();say('Back to box 1.');card()}],['Stop',menu]])}],['Stop',menu]])}
function badges(){var P=N.progress,b=P.badges.map(function(x){return N.badgeDefs[x][0]+' ('+N.badgeDefs[x][1]+')'});say('Experience points: '+P.xp+'. Best quiz: '+P.quizBest+'%. Badges: '+(b.length?b.join('; '):'none yet.')+' Available: '+Object.keys(N.badgeDefs).map(function(k){return N.badgeDefs[k][0]}).join(', ')+'.');menu()}
function path(){var C=KB.curriculum,i=0;say('The one-hour path has '+C.length+' steps, about '+C.reduce(function(a,c){return a+c[2]},0)+' minutes in all. I will open each room for you.');mode='path';function go(){var c=C[i];N.go(c[1]);say('Step '+(i+1)+' of '+C.length+': '+c[0]+' (about '+c[2]+' min). '+c[3]);i++;if(i<C.length)chips([['Next step',go],['Stop',menu]]);else{chips([['Quiz me',function(){quiz(5)}],['Menu',menu]]);say('That is the whole path. A quiz is a good way to finish.')}}go()}
