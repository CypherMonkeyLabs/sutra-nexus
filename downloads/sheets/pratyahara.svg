<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" role="img" aria-label="Pratyāhāra cheat sheet">
<title>Pratyāhāra cheat sheet</title>
<style>
text { font-family: "Noto Sans Devanagari", "Segoe UI", sans-serif; }

@media (prefers-reduced-motion: reduce) { .mover { display: none; } }

</style>
<rect width="960" height="820" rx="24" fill="#f6f3ff"/>
<rect x="20" y="16" width="920" height="64" rx="16" fill="#1e1b4b"/>
<text x="40" y="56" font-size="26" fill="#f8fafc">Pratyāhāra cheat sheet</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#0891b2"/></marker></defs><rect x="40" y="140" width="191" height="140" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="50" y="178" font-size="13" fill="#1b1340">A pratyāhāra in</text><text x="50" y="196" font-size="13" fill="#1b1340">this app is</text><text x="50" y="214" font-size="13" fill="#1b1340">computed from</text><path d="M 227 210 H 247" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/><rect x="255" y="140" width="191" height="140" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="265" y="178" font-size="13" fill="#1b1340">ac = a i u ṛ ḷ e</text><text x="265" y="196" font-size="13" fill="#1b1340">o ai au</text><path d="M 442 210 H 462" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/><rect x="470" y="140" width="191" height="140" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="480" y="178" font-size="13" fill="#1b1340">hal has 33</text><text x="480" y="196" font-size="13" fill="#1b1340">sounds. al has</text><text x="480" y="214" font-size="13" fill="#1b1340">42 sounds.</text><path d="M 657 210 H 677" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/><rect x="685" y="140" width="191" height="140" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="695" y="178" font-size="13" fill="#1b1340">Markers are</text><text x="695" y="196" font-size="13" fill="#1b1340">dropped. IAST in</text><text x="695" y="214" font-size="13" fill="#1b1340">the file is s</text><text x="40" y="340" font-size="15" fill="#3b3560">A moving dot shows the reading order. Reduced motion hides it.</text>
<rect x="20" y="572" width="920" height="228" rx="16" fill="#d1fae5" stroke="#0f766e" stroke-width="2"/>
<text x="36" y="600" font-size="13" font-weight="700" fill="#052e2b">Disclaimer</text><text x="36" y="618" font-size="11" fill="#0b1f2a">Sūtra Nexus is an independent, free, learning-only student project. It respects every</text><text x="36" y="633" font-size="11" fill="#0b1f2a">tradition, scholar, publisher, company and vendor. Trademarks, texts and sources belong to</text><text x="36" y="648" font-size="11" fill="#0b1f2a">their owners, and nothing here is affiliated with or endorsed by them. If something should</text><text x="36" y="663" font-size="11" fill="#0b1f2a">be removed or corrected, it will be handled promptly through the contact form. Nothing here</text><text x="36" y="678" font-size="11" fill="#0b1f2a">is sold. I am happy to volunteer for any organization.</text><text x="36" y="699" font-size="11" fill="#134e4a">Poster for the cheat sheet. The HTML and PDF carry the full wording and the disclaimer.</text>

</svg>
